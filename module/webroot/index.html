<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Denylist GUI</title>
<style>
  :root { --bg:#121417; --card:#1c1f24; --line:#2a2e35; --fg:#e8eaed; --dim:#9aa0a6;
          --on:#34a853; --warn:#f9ab00; --bad:#ea4335; --acc:#8ab4f8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.4 system-ui,-apple-system,"Noto Sans SC","Noto Sans JP","Noto Sans KR",sans-serif;
         padding:env(safe-area-inset-top) 0 80px; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 14px 8px;
           border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:10px; margin-bottom:2px; }
  h1 { font-size:18px; margin:0; flex:1; }
  /* language button + bottom sheet */
  .lang-btn { display:inline-flex; align-items:center; gap:6px; max-width:52%; padding:6px 10px 6px 9px;
              background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:999px;
              font-size:13px; line-height:1; transition:background .15s, border-color .15s; }
  .lang-btn:active { background:#262a31; }
  .lang-btn:focus-visible, .lang-opt:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .lang-btn svg { flex:none; width:16px; height:16px; }
  .lang-btn .chev { width:14px; height:14px; color:var(--dim); transition:transform .2s; }
  .lang-btn[aria-expanded="true"] .chev { transform:rotate(180deg); }
  .lang-btn span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet { position:fixed; inset:0; z-index:50; visibility:hidden; }
  .sheet.open { visibility:visible; }
  .sheet .scrim { position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; transition:opacity .22s; }
  .sheet.open .scrim { opacity:1; }
  .sheet .panel { position:absolute; left:0; right:0; bottom:0; max-height:78vh; display:flex; flex-direction:column;
                  background:#1e2127; border-radius:24px 24px 0 0; box-shadow:0 -8px 32px rgba(0,0,0,.45);
                  padding:8px 12px calc(14px + env(safe-area-inset-bottom));
                  transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1); }
  .sheet.open .panel { transform:none; }
  .sheet .handle { width:36px; height:4px; border-radius:2px; background:#4a4f57; margin:4px auto 12px; flex:none; }
  .sheet h2 { margin:0 8px 8px; font-size:16px; font-weight:600; flex:none; }
  .sheet .opts { overflow-y:auto; overscroll-behavior:contain; }
  .lang-opt { display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; margin:2px 0;
              background:none; border:0; border-radius:14px; color:var(--fg); text-align:left; }
  .lang-opt:active { background:#2a2e35; }
  .lang-opt .nm { flex:1; min-width:0; }
  .lang-opt .nm b { display:block; font-weight:500; font-size:15px; }
  .lang-opt .nm small { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
  .lang-opt .ck { width:22px; height:22px; flex:none; color:var(--acc); opacity:0; }
  .lang-opt[aria-checked="true"] { background:rgba(138,180,248,.14); }
  .lang-opt[aria-checked="true"] .nm b { color:var(--acc); }
  .lang-opt[aria-checked="true"] .ck { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .sheet .panel, .sheet .scrim, .lang-btn .chev { transition:none; } }
  .sub { color:var(--dim); font-size:12px; }
  .bar { display:flex; gap:8px; margin-top:10px; }
  input[type=search] { flex:1; min-width:0; background:var(--card); color:var(--fg); border:1px solid var(--line);
         border-radius:10px; padding:10px 12px; font-size:15px; outline:none; }
  .seg { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip { background:var(--card); border:1px solid var(--line); color:var(--dim);
          border-radius:999px; padding:6px 12px; font-size:13px; }
  .chip.act { color:var(--bg); background:var(--acc); border-color:var(--acc); }
  button { font:inherit; cursor:pointer; }
  .btn { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:10px;
         padding:9px 12px; font-size:14px; white-space:nowrap; }
  .btn.pri { background:var(--acc); color:#10151c; border-color:var(--acc); font-weight:600; }
  .btn.sm { padding:5px 10px; font-size:13px; }
  #banner { display:none; margin:10px 14px 0; padding:10px 12px; border-radius:10px;
            background:#3a2f0b; color:#fde293; font-size:13px; align-items:center; gap:10px; }
  #banner.show { display:flex; }
  #banner span { flex:1; }
  #scanBox { display:none; margin:10px 14px 0; background:var(--card); border:1px solid var(--line);
             border-radius:12px; padding:10px 12px; }
  #scanBox.show { display:block; }
  #scanBox h3 { margin:0 0 6px; font-size:14px; }
  ul { list-style:none; margin:8px 0 0; padding:0; }
  li.app { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); }
  li.app .name { flex:1; min-width:0; word-break:break-all; font-size:14px; }
  .tag { font-size:11px; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:1px; white-space:nowrap; }
  .tag.pairip { background:#3b1d1d; color:#f28b82; }
  .tag.rootcheck { background:#3a2f0b; color:#fde293; }
  .tag.other { background:#26292f; color:var(--dim); }
  /* switch */
  .sw { position:relative; width:46px; height:26px; flex:none; }
  .sw input { opacity:0; width:0; height:0; }
  .sw i { position:absolute; inset:0; background:#3c4043; border-radius:26px; transition:.18s; }
  .sw i::before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px;
                  background:#fff; border-radius:50%; transition:.18s; }
  .sw input:checked + i { background:var(--on); }
  .sw input:checked + i::before { transform:translateX(20px); }
  .sw input:disabled + i { opacity:.5; }
  #msg { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#303134;
         color:var(--fg); padding:9px 14px; border-radius:10px; font-size:13px; opacity:0;
         transition:opacity .2s; pointer-events:none; max-width:90%; }
  #msg.show { opacity:1; }
  .empty { color:var(--dim); text-align:center; padding:30px 14px; }
  .err { color:#f28b82; padding:20px 14px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Denylist GUI</h1>
    <button class="lang-btn" id="langBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="langSheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
      <span id="langName"></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
  <div class="sub" data-i18n-html="sub"></div>
  <div class="bar">
    <input id="q" type="search" data-i18n-ph="search" autocomplete="off">
    <button class="btn" id="scanBtn" data-i18n="scan"></button>
  </div>
  <div class="seg" id="seg">
    <button class="chip act" data-f="all"><span data-i18n="all"></span> <b id="cAll">0</b></button>
    <button class="chip" data-f="on"><span data-i18n="on"></span> <b id="cOn">0</b></button>
    <button class="chip" data-f="off"><span data-i18n="off"></span> <b id="cOff">0</b></button>
    <button class="chip" id="sysBtn" style="margin-left:auto"></button>
  </div>
</header>

<div id="banner"><span id="pendingTxt"></span>
  <button class="btn sm pri" id="rebootBtn" data-i18n="reboot"></button></div>

<div id="scanBox"><h3 data-i18n="scanTitle"></h3><ul id="scanList"></ul></div>

<ul id="list"></ul>
<div id="msg"></div>

<div class="sheet" id="langSheet" role="dialog" aria-modal="true" aria-labelledby="langTitle">
  <div class="scrim" data-close></div>
  <div class="panel">
    <div class="handle" data-close></div>
    <h2 id="langTitle"></h2>
    <div class="opts" id="langOpts" role="radiogroup" aria-labelledby="langTitle"></div>
  </div>
</div>

const LANG_KEY = "denylist_gui.lang";

function detectLang() {
  try { const s = localStorage.getItem(LANG_KEY); if (s && I18N[s]) return s; } catch (e) {}
  const cands = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
  for (const raw of cands) {
    const l = String(raw).toLowerCase();
    if (l.startsWith("zh")) return /tw|hk|mo|hant/.test(l) ? "zh-TW" : "zh-CN";
    const base = l.split("-")[0];
    if (I18N[base]) return base;
  }
  return "en";
}
let lang = detectLang();

function t(key, vars) {
  const s = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (m, n) => (n in vars ? vars[n] : m)) : s;
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml)); // trusted dictionary text only
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.getElementById("langName").textContent = I18N[lang]._name;
  document.getElementById("langBtn").setAttribute("aria-label", t("lang") + ": " + I18N[lang]._name);
  document.getElementById("langTitle").textContent = t("lang");
  document.querySelectorAll(".lang-opt").forEach(o => o.setAttribute("aria-checked", String(o.dataset.lang === lang)));
  document.getElementById("sysBtn").textContent = t(showSys ? "sysOn" : "sysOff");
  document.getElementById("pendingTxt").innerHTML = t("pending", { n: changed });
}

function setLang(l) {
  if (!I18N[l]) return;
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  applyStatic(); render(); renderScan();
}

/* ---------- app ---------- */
const CTL = "sh /data/adb/modules/denylist_gui/denyctl.sh";
const state = new Map();   // pkg -> 0/1
const sys = new Set();     // system apps
let filter = "all", changed = 0, showSys = false;
let listStatus = { kind: "loading" };   // loading | ok | error
let scanState = null;                   // null | {kind:"loading"} | {kind:"ok", hits} | {kind:"error", msg}
// System apps are hidden by default, but those already on the denylist are always shown
const visible = p => showSys || !sys.has(p) || state.get(p) === 1;

// KernelSU / APatch WebUI bridge: ksu.exec(cmd, optionsJson, callbackName) -> cb(errno, stdout, stderr)
function sh(cmd) {
  return new Promise((resolve, reject) => {
    if (!window.ksu || typeof ksu.exec !== "function") return reject(new Error("no-bridge"));
    const cb = "__dg" + Date.now() + Math.floor(Math.random() * 1e6);
    window[cb] = (errno, stdout, stderr) => {
      delete window[cb];
      Number(errno) === 0 ? resolve(stdout || "") : reject(new Error(stderr || "errno " + errno));
    };
    try { ksu.exec(cmd, "{}", cb); } catch (e) { delete window[cb]; reject(e); }
  });
}
const safe = p => /^[A-Za-z0-9._]+$/.test(p);   // only valid package names reach the shell

function toast(s) {
  const m = document.getElementById("msg"); m.textContent = s; m.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => m.classList.remove("show"), 1800);
  try { ksu.toast && ksu.toast(s); } catch (e) {}
}
function bump() {
  changed++; document.getElementById("pendingTxt").innerHTML = t("pending", { n: changed });
  document.getElementById("banner").classList.add("show");
}
function counts() {
  let all = 0, on = 0;
  state.forEach((v, p) => { if (visible(p)) { all++; on += v; } });
  cAll.textContent = all; cOn.textContent = on; cOff.textContent = all - on;
}
function msgLi(cls, text, html) {
  const li = document.createElement("li"); li.className = cls;
  html ? (li.innerHTML = text) : (li.textContent = text);
  return li;
}

function row(pkg, tag) {
  const li = document.createElement("li"); li.className = "app"; li.dataset.pkg = pkg;
  const name = document.createElement("div"); name.className = "name"; name.textContent = pkg;
  if (sys.has(pkg)) { const s = document.createElement("span"); s.className = "tag other"; s.textContent = t("tagSys"); name.appendChild(s); }
  if (tag) {
    const tg = document.createElement("span"); tg.className = "tag " + tag;
    tg.textContent = t({ pairip: "tagPairip", rootcheck: "tagRoot", other: "tagCrash" }[tag] || "tagCrash");
    name.appendChild(tg);
  }
  const lab = document.createElement("label"); lab.className = "sw";
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = state.get(pkg) === 1;
  cb.onchange = () => setPkg(pkg, cb.checked, cb);
  lab.append(cb, document.createElement("i"));
  li.append(name, lab);
  return li;
}

function render() {
  const ul = document.getElementById("list"); ul.innerHTML = "";
  if (listStatus.kind === "loading") return ul.appendChild(msgLi("empty", t("loading")));
  if (listStatus.kind === "error") {
    return ul.appendChild(listStatus.msg === "no-bridge"
      ? msgLi("err", t("noBridge"), true)
      : msgLi("err", t("readFail", { e: listStatus.msg })));
  }
  const q = document.getElementById("q").value.trim().toLowerCase();
  const items = [...state.keys()]
    .filter(visible)
    .filter(p => !q || p.toLowerCase().includes(q))
    .filter(p => filter === "all" || (filter === "on") === (state.get(p) === 1))
    .sort((a, b) => (state.get(b) - state.get(a)) || a.localeCompare(b));
  if (!items.length) return ul.appendChild(msgLi("empty", t("noMatch")));
  const frag = document.createDocumentFragment();
  items.forEach(p => frag.appendChild(row(p)));
  ul.appendChild(frag);
}

function renderScan() {
  if (!scanState) return;
  const ul = document.getElementById("scanList"); ul.innerHTML = "";
  if (scanState.kind === "loading") return ul.appendChild(msgLi("empty", t("scanning")));
  if (scanState.kind === "error") return ul.appendChild(msgLi("err", t("scanFail", { e: scanState.msg })));
  const hits = scanState.hits.filter(([p]) => state.get(p) !== 1);
  if (!hits.length) return ul.appendChild(msgLi("empty", t("scanNone")));
  hits.forEach(([p, tg]) => ul.appendChild(row(p, tg)));
}

async function setPkg(pkg, on, el) {
  if (!safe(pkg)) return toast(t("badPkg"));
  el && (el.disabled = true);
  try {
    const out = await sh(`${CTL} ${on ? "add" : "del"} ${pkg}`);
    if (!out.includes("OK")) throw new Error(out || t("noReply"));
    state.set(pkg, on ? 1 : 0); bump(); counts();
    toast(t(on ? "hid" : "unhid", { p: pkg }));
    document.querySelectorAll(`li.app[data-pkg="${pkg}"] input`).forEach(i => i.checked = on);
    if (filter !== "all") render();
  } catch (e) {
    toast(t("fail", { e: e.message }));
    el && (el.checked = !on);
  } finally { el && (el.disabled = false); }
}

async function load() {
  listStatus = { kind: "loading" }; render();
  try {
    const out = await sh(`${CTL} list`);
    state.clear(); sys.clear();
    out.split("\n").forEach(l => {
      const [p, f, k] = l.trim().split("|");
      if (!p || !safe(p)) return;
      state.set(p, f === "1" ? 1 : 0);
      if (k === "s") sys.add(p);
    });
    listStatus = { kind: "ok" };
    counts();
  } catch (e) {
    listStatus = { kind: "error", msg: e.message };
  }
  render();
}

async function scan() {
  document.getElementById("scanBox").classList.add("show");
  scanState = { kind: "loading" }; renderScan();
  try {
    const out = await sh(`${CTL} scan`);
    const hits = out.split("\n").map(l => l.trim().split("|")).filter(([p]) => p && safe(p) && state.has(p));
    scanState = { kind: "ok", hits };
  } catch (e) { scanState = { kind: "error", msg: e.message }; }
  renderScan();
}

/* ---------- wiring ---------- */
/* language bottom sheet (replaces the native <select>, which Android WebView renders as an old system dialog) */
const LANG_EN = { "zh-CN": "Chinese (Simplified)", "zh-TW": "Chinese (Traditional)", en: "English",
                  ja: "Japanese", ko: "Korean", ru: "Russian", es: "Spanish" };
const sheet = document.getElementById("langSheet"), langBtn = document.getElementById("langBtn");
const opts = document.getElementById("langOpts"), panel = sheet.querySelector(".panel");
const CHECK_SVG = '<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
Object.keys(I18N).forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "lang-opt"; b.dataset.lang = k; b.lang = k; b.setAttribute("role", "radio");
  const nm = document.createElement("span"); nm.className = "nm";
  const main = document.createElement("b"); main.textContent = I18N[k]._name; nm.appendChild(main);
  if (LANG_EN[k] && LANG_EN[k] !== I18N[k]._name) {
    const sub = document.createElement("small"); sub.textContent = LANG_EN[k]; sub.lang = "en"; nm.appendChild(sub);
  }
  b.appendChild(nm); b.insertAdjacentHTML("beforeend", CHECK_SVG);
  b.onclick = () => { setLang(k); closeSheet(); };
  opts.appendChild(b);
});

let sheetHist = false;   // a history entry was pushed so the Android back gesture closes the sheet
const isOpen = () => sheet.classList.contains("open");
function openSheet() {
  if (isOpen()) return;
  sheet.classList.add("open"); langBtn.setAttribute("aria-expanded", "true");
  document.body.style.overflow = "hidden";
  try { history.pushState({ dgSheet: 1 }, ""); sheetHist = true; } catch (e) { sheetHist = false; }
  setTimeout(() => (opts.querySelector('[aria-checked="true"]') || opts.firstElementChild).focus(), 60);
}
function closeSheet(fromPopstate) {
  if (!isOpen()) return;
  sheet.classList.remove("open"); langBtn.setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
  if (sheetHist && !fromPopstate) history.back();
  sheetHist = false;
  langBtn.focus({ preventScroll: true });
}
langBtn.onclick = openSheet;
sheet.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); });
window.addEventListener("popstate", () => closeSheet(true));
document.addEventListener("keydown", e => {
  if (!isOpen()) return;
  if (e.key === "Escape") { e.preventDefault(); closeSheet(); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const list = [...opts.children], i = list.indexOf(document.activeElement);
    list[(i + (e.key === "ArrowDown" ? 1 : -1) + list.length) % list.length].focus();
    e.preventDefault();
  }
});
// swipe down to close (ignored while the list itself is scrolled)
let dragY = null, dragDy = 0;
panel.addEventListener("touchstart", e => {
  if (opts.contains(e.target) && opts.scrollTop > 0) return;
  dragY = e.touches[0].clientY; dragDy = 0; panel.style.transition = "none";
}, { passive: true });
panel.addEventListener("touchmove", e => {
  if (dragY === null) return;
  dragDy = Math.max(0, e.touches[0].clientY - dragY);
  panel.style.transform = dragDy ? `translateY(${dragDy}px)` : "";
}, { passive: true });
panel.addEventListener("touchend", () => {
  if (dragY === null) return;
  panel.style.transition = ""; panel.style.transform = "";
  if (dragDy > 80) closeSheet();
  dragY = null;
});

document.getElementById("q").oninput = render;
document.getElementById("scanBtn").onclick = scan;
document.getElementById("sysBtn").onclick = e => {
  e.stopPropagation(); showSys = !showSys;
  e.currentTarget.textContent = t(showSys ? "sysOn" : "sysOff");
  e.currentTarget.classList.toggle("act", showSys);
  counts(); render();
};
document.getElementById("seg").onclick = e => {
  const b = e.target.closest(".chip[data-f]"); if (!b) return;
  filter = b.dataset.f; document.querySelectorAll(".chip[data-f]").forEach(c => c.classList.toggle("act", c === b)); render();
};
document.getElementById("rebootBtn").onclick = () => {
  if (confirm(t("confirmReboot"))) sh("svc power reboot || reboot").catch(e => toast(t("rebootFail", { e: e.message })));
};

applyStatic();
load();
</script>
</body>
</html>
